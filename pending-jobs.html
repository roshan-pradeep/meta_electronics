<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Pending Jobs</title>
    <!-- CSS ස්ටයිල් ෆයිල් එක සම්බන්ධ කිරීම -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase සහ ImgBB API සඳහා අවශ්‍ය පහසුකම් -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="logo-container">
    <img src="logo.png" alt="Meta Electronics Logo" class="site-logo">
</div>

    <div class="container" style="max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Pending Repair Jobs</h2>
            <!-- නැවත ඩෑෂ්බෝඩ් එකට යාමට බොත්තම -->
            <a href="index.html" class="btn" style="width: auto; padding: 8px 15px; text-decoration: none; background-color: #6c757d; text-align: center;">Dashboard</a>
        </div>

        <!-- දුරකථන අංක අනුව ෆිල්ටර් කිරීමට බොත්තම් වැටෙන කොටස (රතු පාටින්) -->
        <div id="phone-filter-container" style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px;">
            <!-- අංක අනුව බොත්තම් මෙතැනට ජනාවෙයි -->
        </div>

        <!-- Pending Jobs ලැයිස්තුව වැටෙන කන්ටේනර් එක -->
        <div id="pending-jobs-container">
            <p style="text-align: center; color: #666; font-weight: bold;">Please click a phone number button above to view jobs.</p>
        </div>
    </div>

    <!-- පාරිභෝගිකයාගේ සියලුම ජොබ්ස් පෙන්වන Modal / Pop-up එක -->
    <div id="customer-jobs-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; text-align: left; position: relative;">
            <button onclick="closeModal()" style="position: absolute; top: 15px; right: 15px; background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Close X</button>
            <h3 id="modal-title" style="margin-top: 0; color: #333;">Customer Jobs</h3>
            <div id="modal-content">
                <!-- අදාළ අංකයේ ජොබ්ස් මෙතැනට ලෝඩ් වේ -->
            </div>
        </div>
    </div>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ImgBB API Key (පින්තූර අප්ලෝඩ් කිරීමට)
        const IMGBB_API_KEY = 'YOUR_IMGBB_API_KEY_HERE'; 

        const pendingJobsContainer = document.getElementById('pending-jobs-container');
        const phoneFilterContainer = document.getElementById('phone-filter-container');

        let allPendingJobs = []; // සියලුම පෙන්ඩින් ජොබ්ස් ගබඩා කරගැනීමට

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchPendingJobs();
        });

        async function fetchPendingJobs() {
            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('status', 'Pending')
                .order('created_at', { ascending: false });

            if (error) {
                pendingJobsContainer.innerHTML = `<p style="color: red; text-align: center;">Error loading jobs: ${error.message}</p>`;
                console.error(error);
                return;
            }

            if (jobs.length === 0) {
                pendingJobsContainer.innerHTML = `<p style="text-align: center; color: #666;">No pending jobs found.</p>`;
                phoneFilterContainer.innerHTML = '';
                return;
            }

            allPendingJobs = jobs; // ගබඩා කරගැනීම
            createPhoneFilterButtons(allPendingJobs);
            
            // මුලින්ම ජොබ්ස් ඔක්කොම පෙන්වන්නේ නැතිව, ෆෝන් අංකයක් තෝරන්න කියන එක පෙන්වයි
            pendingJobsContainer.innerHTML = `<p style="text-align: center; color: #666; font-weight: bold; background: #fff; padding: 20px; border: 1px dashed #ccc; border-radius: 8px;">👈 Please click a phone number button above to view pending jobs.</p>`;
        }

        // දුරකථන අංක සඳහා ඉහළින් රතු පාටින් බොත්තම් සෑදීම
        function createPhoneFilterButtons(jobs) {
            phoneFilterContainer.innerHTML = '';

            // අද්විතීය දුරකථන අංක (Unique Phone Numbers) පමණක් ලබා ගැනීම
            const uniquePhones = [...new Set(jobs.map(job => job.customer_phone))];

            // "All Jobs" පෙන්වන මූලික බොත්තම (අවශ්‍ය නම් සියලුම පෙන්ඩින් ජොබ්ස් බලාගන්න)
            const allBtn = document.createElement('button');
            allBtn.textContent = "All Pending Jobs";
            allBtn.style.cssText = "background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;";
            allBtn.onclick = () => displayJobs(allPendingJobs);
            phoneFilterContainer.appendChild(allBtn);

            // එක් එක් දුරකථන අංකයට රතු පාටින් බොත්තමක් සෑදීම
            uniquePhones.forEach(phone => {
                const phoneBtn = document.createElement('button');
                phoneBtn.innerHTML = `📞 ${phone}`;
                phoneBtn.style.cssText = "background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;";
                
                // බොත්තම ක්ලික් කළ විට අදාළ අංකයේ පෙන්ඩින් ජොබ්ස් පමණක් ෆිල්ටර් කිරීම
                phoneBtn.onclick = () => {
                    const filteredJobs = allPendingJobs.filter(job => job.customer_phone === phone);
                    displayJobs(filteredJobs);
                };

                phoneFilterContainer.appendChild(phoneBtn);
            });
        }

        // ෆිල්ටර් කළ ජොබ්ස් කාඩ්පත් ස්ක්‍රීන් එකේ පෙන්වීම සඳහා වන ප්‍රධාන ෆන්ක්ෂන් එක
        function displayJobs(jobs) {
            if (jobs.length === 0) {
                pendingJobsContainer.innerHTML = `<p style="text-align: center; color: #666;">No jobs match this filter.</p>`;
                return;
            }

            pendingJobsContainer.innerHTML = '';
            jobs.forEach(job => {
                const jobCard = document.createElement('div');
                jobCard.style.cssText = "background: #f9f9f9; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 8px; text-align: left;";
                
                jobCard.innerHTML = `
                    <p><strong>Item:</strong> ${job.item}</p>
                    <p><strong>Model:</strong> ${job.model}</p>
                    <p><strong>Serial Number:</strong> ${job.serial_number}</p>
                    <p><strong>Fault:</strong> ${job.fault}</p>
                    
                    <!-- පාරිභෝගිකයාගේ දුරකථන අංකය ක්ලික් කළ හැකි බොත්තමක් ලෙස -->
                    <p><strong>Customer Phone:</strong> 
                        <button onclick="viewCustomerJobs('${job.customer_phone}')" style="background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                            📞 ${job.customer_phone}
                        </button>
                    </p>

                    <p><strong>Advance Amount:</strong> Rs. ${job.advance_amount || 0}</p>
                    <p style="font-size: 12px; color: #777;">Registered Date: ${new Date(job.created_at).toLocaleString()}</p>
                    
                    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
                    
                    <!-- ජොබ් එක Finished කිරීමට අවශ්‍ය ෆෝම් කොටස -->
                    <div style="background: #fff; padding: 15px; border: 1px solid #ccc; border-radius: 6px;">
                        <h4 style="margin-top: 0; color: #333;">Complete Repair Job</h4>
                        
                        <div class="form-group" style="margin-bottom: 10px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Repair Charges (Rs.):</label>
                            <input type="number" id="charges-${job.id}" placeholder="Enter total charges" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>

                        <div class="form-group" style="margin-bottom: 10px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Repair Description / Parts Replaced:</label>
                            <textarea id="desc-${job.id}" placeholder="Enter details of repair or replaced parts" style="width: 100%; padding: 8px; box-sizing: border-box; height: 60px;"></textarea>
                        </div>

                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Upload Repair Photo (Optional):</label>
                            <input type="file" id="photo-${job.id}" accept="image/*" style="width: 100%;">
                        </div>

                        <button onclick="finishJob('${job.id}', '${job.customer_phone}', '${job.item}', '${job.model}')" class="btn" style="background-color: #28a745; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%;">Mark as Finished & Notify Customer</button>
                    </div>
                `;

                pendingJobsContainer.appendChild(jobCard);
            });
        }

        // දුරකථන අංකය ක්ලික් කළ විට එම අංකයට අදාළ සියලුම ජොබ්ස් පෙන්වීමේ ෆන්ක්ෂන් එක
        async function viewCustomerJobs(phone) {
            const modal = document.getElementById('customer-jobs-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');

            modalTitle.textContent = `All Jobs for Phone: ${phone}`;
            modalContent.innerHTML = `<p style="text-align: center; color: #666;">Loading...</p>`;
            modal.style.display = 'flex';

            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('customer_phone', phone)
                .order('created_at', { ascending: false });

            if (error) {
                modalContent.innerHTML = `<p style="color: red;">Error loading customer jobs: ${error.message}</p>`;
                return;
            }

            if (jobs.length === 0) {
                modalContent.innerHTML = `<p style="color: #666;">No jobs found for this phone number.</p>`;
                return;
            }

            modalContent.innerHTML = '';
            jobs.forEach(job => {
                let statusColor = job.status === 'Finished' ? 'green' : 'orange';
                const jobBox = document.createElement('div');
                jobBox.style.cssText = "background: #f1f1f1; border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; border-radius: 6px;";
                
                jobBox.innerHTML = `
                    <p><strong>Item:</strong> ${job.item} (${job.model})</p>
                    <p><strong>Serial:</strong> ${job.serial_number}</p>
                    <p><strong>Fault:</strong> ${job.fault}</p>
                    <p><strong>Status:</strong> <span style="color: ${statusColor}; font-weight: bold;">${job.status}</span></p>
                    <p><strong>Advance:</strong> Rs. ${job.advance_amount || 0}</p>
                    ${job.repair_charges ? `<p><strong>Charges:</strong> Rs. ${job.repair_charges}</p>` : ''}
                    ${job.description ? `<p><strong>Description:</strong> ${job.description}</p>` : ''}
                    <p style="font-size: 11px; color: #555;">Date: ${new Date(job.created_at).toLocaleString()}</p>
                `;
                modalContent.appendChild(jobBox);
            });
        }

        function closeModal() {
            document.getElementById('customer-jobs-modal').style.display = 'none';
        }

        // ජොබ් එක Finished ලෙස අප්ඩේට් කිරීම සහ Finished Jobs පේජ් එකට යැවීම හැසිරවීම
        async function finishJob(jobId, customerPhone, item, model) {
            const chargesInput = document.getElementById(`charges-${jobId}`).value;
            const descInput = document.getElementById(`desc-${jobId}->${jobId}`)?.value || document.getElementById(`desc-${jobId}`).value;
            const photoInput = document.getElementById(`photo-${jobId}`).files[0];

            if (!chargesInput) {
                alert("Please enter repair charges!");
                return;
            }

            let photoUrl = '';

            if (photoInput) {
                const formData = new FormData();
                formData.append('image', photoInput);

                try {
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();
                    if (result.success) {
                        photoUrl = result.data.url;
                    } else {
                        alert("Photo upload failed, but job will be finished without photo.");
                    }
                } catch (err) {
                    console.error("Image upload error:", err);
                }
            }

            // Supabase ඩේටාබේස් එකේ Status එක 'Finished' ලෙස වෙනස් කිරීම
            const { error } = await supabaseClient
                .from('jobs')
                .update({
                    status: 'Finished',
                    repair_charges: parseFloat(chargesInput),
                    description: descInput,
                    photo_url: photoUrl
                })
                .eq('id', jobId);

            if (error) {
                alert("Error updating job: " + error.message);
                console.error(error);
            } else {
                alert("Job marked as Finished successfully!");

                // පාරිභෝගිකයාට WhatsApp මඟින් මැසේජ් එක යැවීම
                let cleanPhone = customerPhone.replace(/^0/, '');
                let customerMsg = `Hello, your repair job for ${item} (${model}) is now FINISHED at Meta Electronics. Charges: Rs. ${chargesInput}. Track status & details here: https://roshan-pradeep.github.io/meta_electronics/customer.html?phone=${customerPhone}`;
                let whatsappUrl = `https://wa.me/94${cleanPhone}?text=${encodeURIComponent(customerMsg)}`;
                
                window.open(whatsappUrl, '_blank');

                // Finish Jobs පේජ් එකට (`finish-jobs.html`) ස්වයංක්‍රීයව යොමු කිරීම
                window.location.href = 'finish-jobs.html';
            }
        }
    </script>
</body>
</html>
