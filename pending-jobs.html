<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Pending Jobs & Estimate</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Pending Repair Jobs (Estimate)</h2>
            <a href="index.html" class="btn" style="width: auto; padding: 8px 15px; text-decoration: none; background-color: #6c757d; text-align: center;">Dashboard</a>
        </div>

        <!-- Phone Filter Buttons -->
        <div id="phone-filter-container" style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px;"></div>

        <!-- Pending Jobs Container -->
        <div id="pending-jobs-container">
            <p style="text-align: center; color: #666; font-weight: bold;">Please click a phone number button above to view jobs.</p>
        </div>
    </div>

    <!-- Customer Jobs Modal -->
    <div id="customer-jobs-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; text-align: left; position: relative;">
            <button onclick="closeModal()" style="position: absolute; top: 15px; right: 15px; background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Close X</button>
            <h3 id="modal-title" style="margin-top: 0; color: #333;">Customer Jobs</h3>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const pendingJobsContainer = document.getElementById('pending-jobs-container');
        const phoneFilterContainer = document.getElementById('phone-filter-container');

        let allPendingJobs = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchPendingJobs();
        });

        async function fetchPendingJobs() {
            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('status', 'Pending')
                .order('created_at', { ascending: false });

            if (error) {
                pendingJobsContainer.innerHTML = `<p style="color: red; text-align: center;">Error loading jobs: ${error.message}</p>`;
                return;
            }

            if (jobs.length === 0) {
                pendingJobsContainer.innerHTML = `<p style="text-align: center; color: #666;">No pending jobs found.</p>`;
                phoneFilterContainer.innerHTML = '';
                return;
            }

            allPendingJobs = jobs;
            createPhoneFilterButtons(allPendingJobs);
            pendingJobsContainer.innerHTML = `<p style="text-align: center; color: #666; font-weight: bold; background: #fff; padding: 20px; border: 1px dashed #ccc; border-radius: 8px;">👈 Please click a phone number button above to view pending jobs.</p>`;
        }

        function createPhoneFilterButtons(jobs) {
            phoneFilterContainer.innerHTML = '';
            const uniquePhones = [...new Set(jobs.map(job => job.customer_phone))];

            const allBtn = document.createElement('button');
            allBtn.textContent = "All Pending Jobs";
            allBtn.style.cssText = "background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;";
            allBtn.onclick = () => displayJobs(allPendingJobs);
            phoneFilterContainer.appendChild(allBtn);

            uniquePhones.forEach(phone => {
                const phoneBtn = document.createElement('button');
                phoneBtn.innerHTML = `📞 ${phone}`;
                phoneBtn.style.cssText = "background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;";
                phoneBtn.onclick = () => {
                    const filteredJobs = allPendingJobs.filter(job => job.customer_phone === phone);
                    displayJobs(filteredJobs);
                };
                phoneFilterContainer.appendChild(phoneBtn);
            });
        }

        function displayJobs(jobs) {
            if (jobs.length === 0) {
                pendingJobsContainer.innerHTML = `<p style="text-align: center; color: #666;">No jobs match this filter.</p>`;
                return;
            }

            pendingJobsContainer.innerHTML = '';
            jobs.forEach(job => {
                const jobCard = document.createElement('div');
                jobCard.style.cssText = "background: #f9f9f9; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 8px; text-align: left;";
                
                jobCard.innerHTML = `
                    <p><strong>Item:</strong> ${job.item}</p>
                    <p><strong>Model:</strong> ${job.model}</p>
                    <p><strong>Serial Number:</strong> ${job.serial_number}</p>
                    <p><strong>Fault:</strong> ${job.fault}</p>
                    <p><strong>Customer Phone:</strong> 
                        <button onclick="viewCustomerJobs('${job.customer_phone}')" style="background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                            📞 ${job.customer_phone}
                        </button>
                    </p>
                    <p><strong>Advance Amount:</strong> Rs. ${job.advance_amount || 0}</p>
                    <p style="font-size: 12px; color: #777;">Registered Date: ${new Date(job.created_at).toLocaleString()}</p>
                    
                    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
                    
                    <div style="background: #fff; padding: 15px; border: 1px solid #ccc; border-radius: 6px;">
                        <h4 style="margin-top: 0; color: #333;">Prepare & Send Estimate</h4>
                        
                        <div class="form-group" style="margin-bottom: 10px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Estimated Charges (Rs.):</label>
                            <input type="number" id="charges-${job.id}" placeholder="Enter estimated charges" style="width: 100%; padding: 8px; box-sizing: border-box;">
                        </div>

                        <div class="form-group" style="margin-bottom: 10px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px;">Repair Description / Parts Needed:</label>
                            <textarea id="desc-${job.id}" placeholder="Enter repair details or needed parts" style="width: 100%; padding: 8px; box-sizing: border-box; height: 60px;"></textarea>
                        </div>

                        <div class="form-group" style="margin-bottom: 10px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #d9534f;">Damage Parts Photos (Max 5):</label>
                            <input type="file" id="damage-photos-${job.id}" accept="image/*" multiple onchange="previewImages(this, 'damage-preview-${job.id}')" style="width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; background: #fff;">
                            <small style="color: #666;">Select up to 5 images from phone/PC gallery.</small>
                            <div id="damage-preview-${job.id}" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;"></div>
                        </div>

                        <div class="form-group" style="margin-bottom: 15px;">
                            <label style="display: block; font-weight: bold; margin-bottom: 5px; color: #0275d8;">New Parts Photos (Max 5):</label>
                            <input type="file" id="new-photos-${job.id}" accept="image/*" multiple onchange="previewImages(this, 'new-preview-${job.id}')" style="width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; background: #fff;">
                            <small style="color: #666;">Select up to 5 images from phone/PC gallery.</small>
                            <div id="new-preview-${job.id}" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;"></div>
                        </div>

                        <!-- මෙන්න ඔය බටන් එක (Estimate Send to Customer) -->
                        <button onclick="sendEstimate('${job.id}', '${job.customer_phone}', '${job.item}', '${job.model}')" class="btn" style="background-color: #ffc107; color: #000; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold;">Estimate Send to Customer</button>
                    </div>
                `;
                pendingJobsContainer.appendChild(jobCard);
            });
        }

        function previewImages(input, previewContainerId) {
            const previewContainer = document.getElementById(previewContainerId);
            previewContainer.innerHTML = '';

            if (input.files) {
                const files = Array.from(input.files).slice(0, 5);
                files.forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.cssText = "width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd;";
                        previewContainer.appendChild(img);
                    }
                    reader.readAsDataURL(file);
                });
            }
        }

        async function viewCustomerJobs(phone) {
            const modal = document.getElementById('customer-jobs-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');

            modalTitle.textContent = `All Jobs for Phone: ${phone}`;
            modalContent.innerHTML = `<p style="text-align: center; color: #666;">Loading...</p>`;
            modal.style.display = 'flex';

            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('customer_phone', phone)
                .order('created_at', { ascending: false });

            if (error) {
                modalContent.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                return;
            }

            modalContent.innerHTML = '';
            jobs.forEach(job => {
                let statusColor = 'orange';
                if (job.status === 'Approved') statusColor = 'blue';
                else if (job.status === 'Non-Approved') statusColor = 'red';
                else if (job.status === 'Finished') statusColor = 'green';

                const jobBox = document.createElement('div');
                jobBox.style.cssText = "background: #f1f1f1; border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; border-radius: 6px;";
                jobBox.innerHTML = `
                    <p><strong>Item:</strong> ${job.item} (${job.model})</p>
                    <p><strong>Status:</strong> <span style="color: ${statusColor}; font-weight: bold;">${job.status}</span></p>
                    <p><strong>Cost:</strong> Rs. ${job.repair_charges || 0}</p>
                `;
                modalContent.appendChild(jobBox);
            });
        }

        function closeModal() {
            document.getElementById('customer-jobs-modal').style.display = 'none';
        }

        // මෙන්න බටන් එක ක්ලික් කළම වැඩ කරන ප්‍රධාන ෆන්ක්ෂන් එක (ෆොටෝස් අප්ලෝඩ් කර, WhatsApp මැසේජ් එක සහ ලින්ක් එක හදන තැන)
        async function sendEstimate(jobId, customerPhone, item, model) {
            const chargesInput = document.getElementById(`charges-${jobId}`).value;
            const descInput = document.getElementById(`desc-${jobId}`).value;
            const damageInput = document.getElementById(`damage-photos-${jobId}`);
            const newPartsInput = document.getElementById(`new-photos-${jobId}`);

            if (!chargesInput) {
                alert("Please enter estimated charges!");
                return;
            }

            let damageImageUrls = [];
            let newImageUrls = [];
            const tempJobId = 'job_' + jobId + '_' + Date.now();

            try {
                // 1. Damage Photos Upload
                if (damageInput.files.length > 0) {
                    const files = Array.from(damageInput.files).slice(0, 5);
                    for (let file of files) {
                        const safeFileName = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
                        const fileName = `damage_${tempJobId}_${Date.now()}_${safeFileName}`;
                        
                        const { data, error } = await supabaseClient.storage
                            .from('job-images')
                            .upload(fileName, file);

                        if (error) {
                            alert("Error uploading damage photo: " + error.message);
                            return;
                        }

                        if (data) {
                            const { data: publicUrlData } = supabaseClient.storage
                                .from('job-images')
                                .getPublicUrl(fileName);
                            damageImageUrls.push(publicUrlData.publicUrl);
                        }
                    }
                }

                // 2. New Parts Photos Upload
                if (newPartsInput.files.length > 0) {
                    const files = Array.from(newPartsInput.files).slice(0, 5);
                    for (let file of files) {
                        const safeFileName = file.name.replace(/[^a-zA-Z0-9_.-]/g, '_');
                        const fileName = `new_${tempJobId}_${Date.now()}_${safeFileName}`;
                        
                        const { data, error } = await supabaseClient.storage
                            .from('job-images')
                            .upload(fileName, file);

                        if (error) {
                            alert("Error uploading new parts photo: " + error.message);
                            return;
                        }

                        if (data) {
                            const { data: publicUrlData } = supabaseClient.storage
                                .from('job-images')
                                .getPublicUrl(fileName);
                            newImageUrls.push(publicUrlData.publicUrl);
                        }
                    }
                }

                let updateData = {
                    repair_charges: parseFloat(chargesInput),
                    description: descInput
                };

                if (damageImageUrls.length > 0) {
                    updateData.damage_images = JSON.stringify(damageImageUrls);
                }
                if (newImageUrls.length > 0) {
                    updateData.new_images = JSON.stringify(newImageUrls);
                }

                // Database එකට ඇස්තමේන්තුව සහ ෆොටෝස් සේව් කිරීම
                const { error } = await supabaseClient
                    .from('jobs')
                    .update(updateData)
                    .eq('id', jobId);

                if (error) {
                    alert("Error saving estimate: " + error.message);
                } else {
                    alert("Estimate and photos saved successfully! Opening WhatsApp...");

                    let cleanPhone = customerPhone.replace(/^0/, '');
                    
                    // බ්‍රව්සර් කැෂ් (Cache) ප්‍රශ්න මඟහරවා ගැනීමට අලුත්ම Timestamp එකක් සහිත Unique Link එකක් සෑදීම
                    let baseUrl = "https://roshan-pradeep.github.io/meta_electronics/customer.html";
                    let uniqueLink = `${baseUrl}?id=${jobId}&v=${Date.now()}`;

                    // WhatsApp මැසේජ් එක සැකසීම (විස්තර + ෆොටෝස් ලින්ක්ස් + කස්ටමර් ලින්ක් එක)
                    let customerMsg = `Hello from Meta Electronics! Your repair estimate for ${item} (${model}) is now ready.\n` +
                                      `Estimated Cost: Rs. ${chargesInput}\n` +
                                      `Details: ${descInput}\n`;

                    // ඩේටාබේස් එකට අප්ලෝඩ් වූ Damage Photos වල ලින්ක්ස් මැසේජ් එකට එකතු කිරීම
                    if (damageImageUrls.length > 0) {
                        customerMsg += `\nDamage Photos:\n` + damageImageUrls.join('\n');
                    }

                    // ඩේටාබේස් එකට අප්ලෝඩ් වූ New Parts Photos වල ලින්ක්ස් මැසේජ් එකට එකතු කිරීම
                    if (newImageUrls.length > 0) {
                        customerMsg += `\n\nNew Parts Photos:\n` + newImageUrls.join('\n');
                    }

                    // අනුමත කිරීමට සහ ප්‍රතික්ෂේප කිරීමට අවශ්‍ය ලින්ක් එක මැසේජ් එක අවසානයට එකතු කිරීම
                    customerMsg += `\n\nPlease check and approve/reject here:\n${uniqueLink}`;
                    
                    let whatsappUrl = `https://wa.me/94${cleanPhone}?text=${encodeURIComponent(customerMsg)}`;
                    
                    // WhatsApp චැට් එක අලුත් ටැබ් එකකින් විවෘත කිරීම සහ පේජ් එක රිෆ්‍රෙෂ් කිරීම
                    window.open(whatsappUrl, '_blank');
                    window.location.reload();
                }
            } catch (err) {
                console.error("Unexpected Error:", err);
                alert("An unexpected error occurred: " + err.message);
            }
        }
    </script>
</body>
</html>
