<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Finish Jobs</title>
    <!-- CSS ස්ටයිල් ෆයිල් එක සම්බන්ධ කිරීම -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JavaScript Library එක CDN එක හරහා ඇතුළත් කිරීම -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Finished Repair Jobs</h2>
            <!-- නැවත ඩෑෂ්බෝඩ් එකට යාමට බොත්තම -->
            <a href="index.html" class="btn" style="width: auto; padding: 8px 15px; text-decoration: none; background-color: #6c757d; text-align: center;">Dashboard</a>
        </div>

        <!-- Finished Jobs ලැයිස්තුව වැටෙන කන්ටේනර් එක -->
        <div id="finish-jobs-container">
            <p style="text-align: center; color: #666;">Loading finished jobs...</p>
        </div>
    </div>

    <!-- පාරිභෝගිකයාගේ සියලුම ජොබ්ස් පෙන්වන Modal / Pop-up එක -->
    <div id="customer-jobs-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; text-align: left; position: relative;">
            <button onclick="closeModal()" style="position: absolute; top: 15px; right: 15px; background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Close X</button>
            <h3 id="modal-title" style="margin-top: 0; color: #333;">Customer Jobs</h3>
            <div id="modal-content">
                <!-- අදාළ අංකයේ ජොබ්ස් මෙතැනට ලෝඩ් වේ -->
            </div>
        </div>
    </div>

    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const finishJobsContainer = document.getElementById('finish-jobs-container');

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchFinishJobs();
        });

        // ඩේටාබේස් එකෙන් Status එක 'Finished' වුණු ජොබ්ස් පමණක් ලබා ගැනීම
        async function fetchFinishJobs() {
            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('status', 'Finished')
                .order('created_at', { ascending: false });

            if (error) {
                finishJobsContainer.innerHTML = `<p style="color: red; text-align: center;">Error loading finished jobs: ${error.message}</p>`;
                console.error(error);
                return;
            }

            if (jobs.length === 0) {
                finishJobsContainer.innerHTML = `<p style="text-align: center; color: #666;">No finished jobs found.</p>`;
                return;
            }

            finishJobsContainer.innerHTML = '';
            jobs.forEach(job => {
                const jobCard = document.createElement('div');
                jobCard.style.cssText = "background: #f9f9f9; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 8px; text-align: left;";
                
                jobCard.innerHTML = `
                    <p><strong>Item:</strong> ${job.item}</p>
                    <p><strong>Model:</strong> ${job.model}</p>
                    <p><strong>Serial Number:</strong> ${job.serial_number}</p>
                    <p><strong>Fault:</strong> ${job.fault}</p>
                    
                    <!-- පාරිභෝගිකයාගේ දුරකථන අංකය ක්ලික් කළ හැකි බොත්තමක් ලෙස -->
                    <p><strong>Customer Phone:</strong> 
                        <button onclick="viewCustomerJobs('${job.customer_phone}')" style="background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                            📞 ${job.customer_phone}
                        </button>
                    </p>

                    <p><strong>Advance Amount:</strong> Rs. ${job.advance_amount || 0}</p>
                    <p><strong>Repair Charges:</strong> Rs. ${job.repair_charges || 0}</p>
                    <p><strong>Description / Parts:</strong> ${job.description || 'N/A'}</p>
                    
                    ${job.photo_url ? `<p><strong>Repair Photo:</strong><br><img src="${job.photo_url}" alt="Repair Photo" style="max-width: 200px; height: auto; margin-top: 5px; border-radius: 4px; border: 1px solid #ccc;"></p>` : ''}
                    
                    <p style="font-size: 12px; color: #777; margin-top: 10px;">Registered Date: ${new Date(job.created_at).toLocaleString()}</p>
                    <p style="color: green; font-weight: bold; margin-top: 5px;">Status: Finished</p>
                `;

                finishJobsContainer.appendChild(jobCard);
            });
        }

        // දුරකථන අංකය ක්ලික් කළ විට එම අංකයට අදාළ සියලුම ජොබ්ස් පෙන්වීමේ פונקציה එක
        async function viewCustomerJobs(phone) {
            const modal = document.getElementById('customer-jobs-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');

            modalTitle.textContent = `All Jobs for Phone: ${phone}`;
            modalContent.innerHTML = `<p style="text-align: center; color: #666;">Loading...</p>`;
            modal.style.display = 'flex';

            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('customer_phone', phone)
                .order('created_at', { ascending: false });

            if (error) {
                modalContent.innerHTML = `<p style="color: red;">Error loading customer jobs: ${error.message}</p>`;
                return;
            }

            if (jobs.length === 0) {
                modalContent.innerHTML = `<p style="color: #666;">No jobs found for this phone number.</p>`;
                return;
            }

            modalContent.innerHTML = '';
            jobs.forEach(job => {
                let statusColor = job.status === 'Finished' ? 'green' : 'orange';
                const jobBox = document.createElement('div');
                jobBox.style.cssText = "background: #f1f1f1; border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; border-radius: 6px;";
                
                jobBox.innerHTML = `
                    <p><strong>Item:</strong> ${job.item} (${job.model})</p>
                    <p><strong>Serial:</strong> ${job.serial_number}</p>
                    <p><strong>Fault:</strong> ${job.fault}</p>
                    <p><strong>Status:</strong> <span style="color: ${statusColor}; font-weight: bold;">${job.status}</span></p>
                    <p><strong>Advance:</strong> Rs. ${job.advance_amount || 0}</p>
                    ${job.repair_charges ? `<p><strong>Charges:</strong> Rs. ${job.repair_charges}</p>` : ''}
                    ${job.description ? `<p><strong>Description:</strong> ${job.description}</p>` : ''}
                    <p style="font-size: 11px; color: #555;">Date: ${new Date(job.created_at).toLocaleString()}</p>
                `;
                modalContent.appendChild(jobBox);
            });
        }

        function closeModal() {
            document.getElementById('customer-jobs-modal').style.display = 'none';
        }
    </script>
</body>
</html>
