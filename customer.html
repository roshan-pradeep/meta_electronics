<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Customer Estimate & Approval</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JavaScript Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 600px; margin-top: 30px;">
        <h2 style="text-align: center; color: #333;">Meta Electronics - Repair Estimate</h2>
        
        <div id="loading-box" style="text-align: center; padding: 20px; font-weight: bold; color: #666;">
            Loading job details...
        </div>

        <!-- ප්‍රධාන විස්තර පෙන්වන කාඩ් එක -->
        <div id="job-details-card" style="display: none; background: #f9f9f9; border: 1px solid #ddd; padding: 20px; border-radius: 8px;">
            <p><strong>Item:</strong> <span id="job-item"></span></p>
            <p><strong>Model:</strong> <span id="job-model"></span></p>
            <p><strong>Serial Number:</strong> <span id="job-serial"></span></p>
            <p><strong>Reported Fault:</strong> <span id="job-fault"></span></p>
            <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
            
            <p><strong>Estimated Cost:</strong> <span id="job-charges" style="color: #d9534f; font-size: 18px; font-weight: bold;"></span></p>
            <p><strong>Repair Description / Parts Needed:</strong></p>
            <p id="job-desc" style="background: #fff; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></p>

            <!-- Damage Photos Section -->
            <div id="damage-section" style="margin-top: 15px; display: none;">
                <p style="font-weight: bold; color: #d9534f;">Damage Parts Photos:</p>
                <div id="damage-gallery" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>

            <!-- New Parts Photos Section -->
            <div id="new-section" style="margin-top: 15px; display: none;">
                <p style="font-weight: bold; color: #0275d8;">New Parts Photos:</p>
                <div id="new-gallery" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

            <!-- ස්ටේටස් එක හෝ දැනුම්දීම් පෙන්වන තැන -->
            <div id="status-display-box" style="text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 16px;"></div>

            <!-- Approve සහ Non-Approved බොත්තම් (මුල් අවස්ථාවේදී හෝ ඇස්තමේන්තු නැති නම් නොපෙන්වයි) -->
            <div id="action-buttons-container" style="display: none; gap: 10px;">
                <button onclick="updateJobStatus('Approved')" style="flex: 1; background: #28a745; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">✅ Approve Estimate</button>
                <button onclick="updateJobStatus('Non-Approved')" style="flex: 1; background: #dc3545; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;">❌ Reject / Non-Approved</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // URL එකේ ඇති job id එක ලබා ගැනීම (උදා: customer.html?id=xxxx)
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('id');

        window.addEventListener('DOMContentLoaded', async () => {
            if (!jobId) {
                document.getElementById('loading-box').innerHTML = `<p style="color: red;">Invalid Job Link!</p>`;
                return;
            }
            await fetchJobDetails();
        });

        async function fetchJobDetails() {
            const { data: job, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('id', jobId)
                .single();

            if (error || !job) {
                document.getElementById('loading-box').innerHTML = `<p style="color: red;">Job not found or error loading details.</p>`;
                return;
            }

            document.getElementById('loading-box').style.display = 'none';
            document.getElementById('job-details-card').style.display = 'block';

            // දත්ත HTML එකට ඇතුළත් කිරීම
            document.getElementById('job-item').textContent = job.item || '';
            document.getElementById('job-model').textContent = job.model || '';
            document.getElementById('job-serial').textContent = job.serial_number || '';
            document.getElementById('job-fault').textContent = job.fault || '';
            document.getElementById('job-charges').textContent = `Rs. ${job.repair_charges || 0}`;
            document.getElementById('job-desc').textContent = job.description || 'No description provided.';

            const actionContainer = document.getElementById('action-buttons-container');
            const statusDisplay = document.getElementById('status-display-box');

            // 1. ජොබ් එක අලුතින් දමා ඇත, තවම ඇස්තමේන්තුවක් (charges) දාලා නැත්නම්
            if (job.status === 'Pending' && (!job.repair_charges || job.repair_charges == 0)) {
                actionContainer.style.display = 'none'; // බටන් සඟවයි
                statusDisplay.innerHTML = `
                    <div style="background: #fff3cd; color: #856404; padding: 15px; border: 1px solid #ffeeba; border-radius: 6px; text-align: center; font-weight: bold;">
                        ⏳ Your item is registered and currently pending for estimate. Please wait until we send you the estimate details!
                    </div>
                `;
            } 
            // 2. කස්ටමර් දැනටමත් Approve හෝ Reject කර ඇත්නම් හෝ ජොබ් එක ඉවර කර ඇත්නම්
            else if (job.status === 'Approved' || job.status === 'Non-Approved' || job.status === 'Finished') {
                actionContainer.style.display = 'none';
                statusDisplay.innerHTML = `Current Status: <span style="color: ${job.status === 'Approved' ? 'green' : 'red'};">${job.status}</span>`;
            } 
            // 3. ඩෑෂ්බෝඩ් එකෙන් Estimate එක දාලා WhatsApp එකෙන් ලින්ක් එක එව්වම (Pending වුණත් charges තියෙනවා නම්)
            else {
                actionContainer.style.display = 'flex'; // බටන් පෙන්වයි
                statusDisplay.style.display = 'none';
            }

            // Damage Photos පෙන්වීම
            if (job.damage_images) {
                try {
                    let damageUrls = JSON.parse(job.damage_images);
                    if (damageUrls.length > 0) {
                        document.getElementById('damage-section').style.display = 'block';
                        const gallery = document.getElementById('damage-gallery');
                        gallery.innerHTML = '';
                        damageUrls.forEach(url => {
                            gallery.innerHTML += `<a href="${url}" target="_blank"><img src="${url}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd;"></a>`;
                        });
                    }
                } catch (e) {
                    console.error("Error parsing damage images:", e);
                }
            }

            // New Parts Photos පෙන්වීම
            if (job.new_images) {
                try {
                    let newUrls = JSON.parse(job.new_images);
                    if (newUrls.length > 0) {
                        document.getElementById('new-section').style.display = 'block';
                        const gallery = document.getElementById('new-gallery');
                        gallery.innerHTML = '';
                        newUrls.forEach(url => {
                            gallery.innerHTML += `<a href="${url}" target="_blank"><img src="${url}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd;"></a>`;
                        });
                    }
                } catch (e) {
                    console.error("Error parsing new images:", e);
                }
            }
        }

        // කස්ටමර් Approve හෝ Non-Approved දුන් විට ඩේටාබේස් එක අප්ඩේට් කිරීම
        async function updateJobStatus(newStatus) {
            if (!confirm(`Are you sure you want to set status as "${newStatus}"?`)) return;

            const { error } = await supabaseClient
                .from('jobs')
                .update({ status: newStatus })
                .eq('id', jobId);

            if (error) {
                alert("Error updating status: " + error.message);
            } else {
                alert(`Successfully updated status to ${newStatus}! Thank you.`);
                window.location.reload();
            }
        }
    </script>
</body>
</html>
