<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Customer Estimate & Status</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 600px; text-align: center;">
        <h2>Job Estimate & Status</h2>
        <div id="job-details-container" style="text-align: left; margin-top: 20px;">
            <p style="text-align: center; color: #666;">Loading job details...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const container = document.getElementById('job-details-container');
        const urlParams = new URLSearchParams(window.location.search);
        const customerPhone = urlParams.get('phone');

        window.addEventListener('DOMContentLoaded', async () => {
            if (!customerPhone) {
                container.innerHTML = `<p style="color: red; text-align: center;">Invalid link or phone number not found!</p>`;
                return;
            }
            await fetchCustomerJobs(customerPhone);
        });

        async function fetchCustomerJobs(phone) {
            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('customer_phone', phone)
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p style="color: red; text-align: center;">Error loading jobs: ${error.message}</p>`;
                return;
            }

            if (jobs.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #666;">No jobs found for this phone number.</p>`;
                return;
            }

            container.innerHTML = '';
            jobs.forEach(job => {
                let statusColor = 'orange';
                if (job.status === 'Approved') statusColor = 'blue';
                else if (job.status === 'Non-Approved') statusColor = 'red';
                else if (job.status === 'Finished') statusColor = 'green';

                const jobCard = document.createElement('div');
                jobCard.style.cssText = "background: #f9f9f9; border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px;";
                
                // ස්ටේටස් එක Pending නම් පමණක් Approve / Non-Approved බොත්තම් පෙන්වීම
                let actionButtonsHTML = '';
                if (job.status === 'Pending') {
                    actionButtonsHTML = `
                        <div id="action-buttons-${job.id}" style="margin-top: 15px; display: flex; gap: 10px;">
                            <button onclick="updateJobStatus('${job.id}', 'Approved')" style="flex: 1; background: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Approve</button>
                            <button onclick="updateJobStatus('${job.id}', 'Non-Approved')" style="flex: 1; background: #dc3545; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">Non-Approved</button>
                        </div>
                    `;
                }

                jobCard.innerHTML = `
                    <p><strong>Item:</strong> ${job.item} (${job.model})</p>
                    <p><strong>Serial Number:</strong> ${job.serial_number}</p>
                    <p><strong>Fault:</strong> ${job.fault}</p>
                    <p><strong>Status:</strong> <span id="status-text-${job.id}" style="color: ${statusColor}; font-weight: bold;">${job.status}</span></p>
                    <p><strong>Advance Amount:</strong> Rs. ${job.advance_amount || 0}</p>
                    ${job.repair_charges ? `<p><strong>Estimated Cost:</strong> Rs. ${job.repair_charges}</p>` : ''}
                    ${job.description ? `<p><strong>Repair Description:</strong> ${job.description}</p>` : ''}
                    
                    ${actionButtonsHTML}
                `;
                container.appendChild(jobCard);
            });
        }

        // ස්ටේටස් එක වෙනස් කර බොත්තම් ක්ෂණිකව අයින් කිරීම
        async function updateJobStatus(jobId, newStatus) {
            const { error } = await supabaseClient
                .from('jobs')
                .update({ status: newStatus })
                .eq('id', jobId);

            if (error) {
                alert("Error updating status: " + error.message);
            } else {
                alert(`Job status updated to ${newStatus} successfully!`);
                
                // බොත්තම් කන්ටේනර් එක ස්ක්‍රීන් එකෙන් ඉවත් කිරීම (අයින් වීම)
                const actionDiv = document.getElementById(`action-buttons-${jobId}`);
                if (actionDiv) {
                    actionDiv.remove();
                }

                // ස්ටේටස් ටෙක්ස්ට් එක වෙනස් කිරීම
                const statusSpan = document.getElementById(`status-text-${jobId}`);
                if (statusSpan) {
                    statusSpan.textContent = newStatus;
                    statusSpan.style.color = newStatus === 'Approved' ? 'blue' : 'red';
                }
            }
        }
    </script>
</body>
</html>
