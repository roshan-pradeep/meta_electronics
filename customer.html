<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Customer Estimate & Status</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 600px; text-align: center;">
        <h2>Job Estimate & Status</h2>
        <div id="job-details-container" style="text-align: left; margin-top: 20px;">
            <p style="text-align: center; color: #666;">Loading job details...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const container = document.getElementById('job-details-container');
        const urlParams = new URLSearchParams(window.location.search);
        const jobId = urlParams.get('id');

        window.addEventListener('DOMContentLoaded', async () => {
            if (!jobId) {
                container.innerHTML = `<p style="color: red; text-align: center;">Invalid link or Job ID not found!</p>`;
                return;
            }
            await fetchSpecificJob(jobId);
        });

        async function fetchSpecificJob(id) {
            const { data: job, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('id', id)
                .single();

            if (error || !job) {
                container.innerHTML = `<p style="color: red; text-align: center;">Job details not found or invalid link!</p>`;
                return;
            }

            let statusColor = 'orange';
            if (job.status === 'Approved') statusColor = 'blue';
            else if (job.status === 'Non-Approved') statusColor = 'red';
            else if (job.status === 'Finished') statusColor = 'green';

            container.innerHTML = '';
            const jobCard = document.createElement('div');
            jobCard.style.cssText = "background: #f9f9f9; border: 1px solid #ddd; padding: 20px; border-radius: 8px;";
            
            let actionButtonsHTML = '';
            if (job.status === 'Pending') {
                actionButtonsHTML = `
                    <div id="action-buttons-wrapper" style="margin-top: 20px; display: flex; gap: 10px;">
                        <button onclick="updateJobStatus('${job.id}', 'Approved')" style="flex: 1; background: #28a745; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;">Approve</button>
                        <button onclick="updateJobStatus('${job.id}', 'Non-Approved')" style="flex: 1; background: #dc3545; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;">Non-Approved</button>
                    </div>
                `;
            } else {
                actionButtonsHTML = `
                    <div id="action-buttons-wrapper" style="margin-top: 20px; background: #e9ecef; padding: 12px; border-radius: 4px; text-align: center;">
                        <p style="margin: 0; color: #495057; font-size: 14px; font-weight: bold;">✓ You have already responded to this estimate (${job.status}).</p>
                    </div>
                `;
            }

            jobCard.innerHTML = `
                <p><strong>Item:</strong> ${job.item} (${job.model})</p>
                <p><strong>Serial Number:</strong> ${job.serial_number}</p>
                <p><strong>Fault:</strong> ${job.fault}</p>
                <p><strong>Status:</strong> <span id="status-text" style="color: ${statusColor}; font-weight: bold;">${job.status}</span></p>
                <p><strong>Advance Amount:</strong> Rs. ${job.advance_amount || 0}</p>
                ${job.repair_charges ? `<p><strong>Estimated Cost:</strong> Rs. ${job.repair_charges}</p>` : ''}
                ${job.description ? `<p><strong>Repair Description:</strong> ${job.description}</p>` : ''}
                <p style="font-size: 12px; color: #777;">Date: ${new Date(job.created_at).toLocaleString()}</p>
                
                <div id="btn-container">
                    ${actionButtonsHTML}
                </div>
            `;
            container.appendChild(jobCard);
        }

        async function updateJobStatus(id, newStatus) {
            console.log("Updating job:", id, "to status:", newStatus);

            const { data, error } = await supabaseClient
                .from('jobs')
                .update({ status: newStatus })
                .eq('id', id)
                .select();

            if (error) {
                console.error("Supabase Error:", error);
                alert("Error updating status: " + error.message);
            } else {
                console.log("Update success:", data);
                alert(`Job status updated to ${newStatus} successfully!`);
                
                const btnContainer = document.getElementById('btn-container');
                if (btnContainer) {
                    btnContainer.innerHTML = `
                        <div style="margin-top: 20px; background: #e9ecef; padding: 12px; border-radius: 4px; text-align: center;">
                            <p style="margin: 0; color: #495057; font-size: 14px; font-weight: bold;">✓ You have already responded to this estimate (${newStatus}).</p>
                        </div>
                    `;
                }

                const statusSpan = document.getElementById('status-text');
                if (statusSpan) {
                    statusSpan.textContent = newStatus;
                    statusSpan.style.color = newStatus === 'Approved' ? 'blue' : 'red';
                }
            }
        }
    </script>
</body>
</html>
