<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Approved Jobs</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container" style="max-width: 800px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Approved Jobs</h2>
            <a href="index.html" class="btn" style="width: auto; padding: 8px 15px; text-decoration: none; background-color: #6c757d; text-align: center;">Dashboard</a>
        </div>

        <!-- දුරකථන අංක ෆිල්ටර් බොත්තම් -->
        <div id="phone-filter-container" style="margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 8px;"></div>

        <!-- ජොබ්ස් ලැයිස්තුව -->
        <div id="approved-jobs-container">
            <p style="text-align: center; color: #666; font-weight: bold;">Loading approved jobs...</p>
        </div>
    </div>

    <!-- පාරිභෝගිකයාගේ ජොබ්ස් පෙන්වන Modal එක -->
    <div id="customer-jobs-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
        <div style="background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; text-align: left; position: relative;">
            <button onclick="closeModal()" style="position: absolute; top: 15px; right: 15px; background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Close X</button>
            <h3 id="modal-title" style="margin-top: 0; color: #333;">Customer Jobs</h3>
            <div id="modal-content"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const jobsContainer = document.getElementById('approved-jobs-container');
        const phoneFilterContainer = document.getElementById('phone-filter-container');
        let allApprovedJobs = [];

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchApprovedJobs();
        });

        async function fetchApprovedJobs() {
            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('status', 'Approved')
                .order('created_at', { ascending: false });

            if (error) {
                jobsContainer.innerHTML = `<p style="color: red; text-align: center;">Error: ${error.message}</p>`;
                return;
            }

            if (!jobs || jobs.length === 0) {
                jobsContainer.innerHTML = `<p style="text-align: center; color: #666;">No approved jobs found.</p>`;
                phoneFilterContainer.innerHTML = '';
                return;
            }

            allApprovedJobs = jobs;
            createPhoneFilterButtons(allApprovedJobs);
            displayJobs(allApprovedJobs);
        }

        function createPhoneFilterButtons(jobs) {
            phoneFilterContainer.innerHTML = '';
            const uniquePhones = [...new Set(jobs.map(job => job.customer_phone))];

            const allBtn = document.createElement('button');
            allBtn.textContent = "All Approved Jobs";
            allBtn.style.cssText = "background: #6c757d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;";
            allBtn.onclick = () => displayJobs(allApprovedJobs);
            phoneFilterContainer.appendChild(allBtn);

            uniquePhones.forEach(phone => {
                const phoneBtn = document.createElement('button');
                phoneBtn.innerHTML = `📞 ${phone}`;
                phoneBtn.style.cssText = "background: #007bff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;";
                phoneBtn.onclick = () => {
                    const filtered = allApprovedJobs.filter(job => job.customer_phone === phone);
                    displayJobs(filtered);
                };
                phoneFilterContainer.appendChild(phoneBtn);
            });
        }

        function displayJobs(jobs) {
            if (jobs.length === 0) {
                jobsContainer.innerHTML = `<p style="text-align: center; color: #666;">No jobs match this filter.</p>`;
                return;
            }

            jobsContainer.innerHTML = '';
            jobs.forEach(job => {
                const card = document.createElement('div');
                card.style.cssText = "background: #f9f9f9; border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; border-radius: 8px; text-align: left;";
                
                card.innerHTML = `
                    <p><strong>Item:</strong> ${job.item}</p>
                    <p><strong>Model:</strong> ${job.model}</p>
                    <p><strong>Serial Number:</strong> ${job.serial_number}</p>
                    <p><strong>Fault:</strong> ${job.fault}</p>
                    <p><strong>Customer Phone:</strong> 
                        <button onclick="viewCustomerJobs('${job.customer_phone}')" style="background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-weight: bold;">
                            📞 ${job.customer_phone}
                        </button>
                    </p>
                    <p><strong>Estimated Cost:</strong> Rs. ${job.repair_charges || 0}</p>
                    <p><strong>Description:</strong> ${job.description || 'N/A'}</p>
                    <p style="font-size: 12px; color: #777;">Date: ${new Date(job.created_at).toLocaleString()}</p>
                    
                    <button onclick="markAsFinished('${job.id}', '${job.customer_phone}', '${job.item}', '${job.model}')" 
                        style="width: 100%; background: #28a745; color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 15px;">
                        ✓ Mark as Finished & Notify Customer
                    </button>
                `;
                jobsContainer.appendChild(card);
            });
        }

        async function markAsFinished(jobId, customerPhone, item, model) {
            const { error } = await supabaseClient
                .from('jobs')
                .update({ status: 'Finished' })
                .eq('id', jobId);

            if (error) {
                alert("Error updating status: " + error.message);
                return;
            }

            let cleanPhone = customerPhone.replace(/^0/, '');
            let customerMsg = `ගරු පාරිභෝගිකයාණනි, ඔබගේ ${item} (${model}) අලුත්වැඩියා කටයුතු අවසන්ය. කරුණාකර දින 3ක් ඇතුළත එය රැගෙන යන්න.\n\nස්ථාන තොරතුරු සහ විස්තර මෙතැනින් බලන්න: https://roshan-pradeep.github.io/meta_electronics/customer.html?id=${jobId}`;
            
            let whatsappUrl = `https://wa.me/94${cleanPhone}?text=${encodeURIComponent(customerMsg)}`;
            
            window.open(whatsappUrl, '_blank');
            window.location.reload();
        }

        async function viewCustomerJobs(phone) {
            const modal = document.getElementById('customer-jobs-modal');
            const modalTitle = document.getElementById('modal-title');
            const modalContent = document.getElementById('modal-content');

            modalTitle.textContent = `All Jobs for Phone: ${phone}`;
            modalContent.innerHTML = `<p style="text-align: center; color: #666;">Loading...</p>`;
            modal.style.display = 'flex';

            const { data: jobs, error } = await supabaseClient
                .from('jobs')
                .select('*')
                .eq('customer_phone', phone)
                .order('created_at', { ascending: false });

            if (error) {
                modalContent.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                return;
            }

            modalContent.innerHTML = '';
            jobs.forEach(job => {
                let statusColor = 'orange';
                if (job.status === 'Approved') statusColor = 'blue';
                else if (job.status === 'Non-Approved') statusColor = 'red';
                else if (job.status === 'Finished') statusColor = 'green';

                const box = document.createElement('div');
                box.style.cssText = "background: #f1f1f1; border: 1px solid #ccc; padding: 12px; margin-bottom: 10px; border-radius: 6px;";
                box.innerHTML = `
                    <p><strong>Item:</strong> ${job.item} (${job.model})</p>
                    <p><strong>Fault:</strong> ${job.fault}</p>
                    <p><strong>Status:</strong> <span style="color: ${statusColor}; font-weight: bold;">${job.status}</span></p>
                    <p><strong>Cost:</strong> Rs. ${job.repair_charges || 0}</p>
                `;
                modalContent.appendChild(box);
            });
        }

        function closeModal() {
            document.getElementById('customer-jobs-modal').style.display = 'none';
        }
    </script>
</body>
</html>
