<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Settings</title>
    <!-- CSS ස්ටයිල් ෆයිල් එක සම්බන්ධ කිරීම -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JavaScript Library එක CDN එක හරහා ඇතුළත් කිරීම -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body.light-mode { background-color: #f4f7f6; color: #333; }
        body.dark-mode { background-color: #121212; color: #f1f1f1; }
        body.dark-mode .card, body.dark-mode .container { background-color: #1e1e1e; color: #f1f1f1; border-color: #333; }
        body.dark-mode input, body.dark-mode select { background-color: #2d2d2d; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body class="light-mode">

    

    <div class="container" style="max-width: 600px; margin-top: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>Client Settings</h2>
            <button onclick="openPage('dashboard')" class="btn" style="width: auto; padding: 8px 15px; background-color: #6c757d;">Dashboard</button>
        </div>

        <!-- 1. Theme Settings -->
        <div class="card" style="background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <h3>Appearance</h3>
            <div class="form-group" style="margin-top: 15px;">
                <label for="theme-selector"><strong>Theme Mode:</strong></label>
                <select id="theme-selector" onchange="changeTheme(this.value)" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px;">
                    <option value="light">Light Mode</option>
                    <option value="dark">Dark Mode</option>
                </select>
            </div>
        </div>

        <!-- 2. Change Phone Number කොටස -->
        <div class="card" style="background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <h3>Change Phone Number</h3>
            <form id="change-phone-form" style="margin-top: 15px;">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="new-phone">New Phone Number</label>
                    <input type="text" id="new-phone" placeholder="Enter new phone number (Ex: 0712345678)" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px;">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Update Phone Number</button>
                <p id="phone-msg" style="margin-top: 10px; font-weight: bold; text-align: center;"></p>
            </form>
        </div>

        <!-- 3. Change Password කොටස -->
        <div class="card" style="background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            <h3>Change Password</h3>
            <form id="change-password-form" style="margin-top: 15px;">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" placeholder="Enter new password" required style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px;">
                </div>
                <button type="submit" class="btn" style="width: 100%;">Update Password</button>
                <p id="password-msg" style="margin-top: 10px; font-weight: bold; text-align: center;"></p>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('meta_theme') || 'light';
            document.body.className = savedTheme + '-mode';
            document.getElementById('theme-selector').value = savedTheme;
        });

        function changeTheme(theme) {
            document.body.className = theme + '-mode';
            localStorage.setItem('meta_theme', theme);
        }

        function openPage(pageName) {
            if (pageName === 'dashboard') {
                window.location.href = 'index.html';
            }
        }

        // 1. Phone Number වෙනස් කිරීම
        const changePhoneForm = document.getElementById('change-phone-form');
        const phoneMsg = document.getElementById('phone-msg');

        changePhoneForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            phoneMsg.textContent = '';

            const newPhoneInput = document.getElementById('new-phone').value.trim();
            const updatedEmail = newPhoneInput + "@meta.lk";

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                phoneMsg.style.color = 'red';
                phoneMsg.textContent = "Error: Please login first!";
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({
                email: updatedEmail
            });

            if (error) {
                phoneMsg.style.color = 'red';
                phoneMsg.textContent = "Error: " + error.message;
            } else {
                phoneMsg.style.color = 'green';
                phoneMsg.textContent = "Phone number updated successfully! Please log in again.";
                changePhoneForm.reset();
                setTimeout(() => {
                    supabaseClient.auth.signOut();
                    window.location.href = 'index.html';
                }, 2500);
            }
        });

        // 2. Password වෙනස් කිරීම
        const changePasswordForm = document.getElementById('change-password-form');
        const passwordMsg = document.getElementById('password-msg');

        changePasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            passwordMsg.textContent = '';

            const newPassword = document.getElementById('new-password').value;
            const { data: { user } } = await supabaseClient.auth.getUser();

            if (!user) {
                passwordMsg.style.color = 'red';
                passwordMsg.textContent = "Error: Please login first!";
                return;
            }

            const { error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });

            if (error) {
                passwordMsg.style.color = 'red';
                passwordMsg.textContent = "Error: " + error.message;
            } else {
                passwordMsg.style.color = 'green';
                passwordMsg.textContent = "Password updated successfully!";
                changePasswordForm.reset(); // මෙතන තිබුණු වැරුද්ද නිවැරදි කර ඇත
            }
        });
    </script>
</body>
</html>
