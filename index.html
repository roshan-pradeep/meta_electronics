<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Admin Dashboard</title>
    <!-- CSS ස්ටයිල් ෆයිල් එක සම්බන්ධ කිරීම -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JavaScript Library එක CDN එක හරහා ඇතුළත් කිරීම -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <!-- 1. Login Section (මුලින්ම ඇමිනිස්ට්‍රේටර්ට ලොග් වීමට පෙන්වන කොටස) -->
        <div id="login-section" class="card">
            
            <!-- ලාංඡනය සහ මාතෘකාව එක පෙළට පෙන්වන කොටස -->
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 20px;">
                <img src="logo.png" alt="Meta Electronics Logo" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover;">
                <h1 style="margin: 0; font-size: 22px;">Welcome Meta Electronics</h1>
            </div>

            <form id="login-form">
                <!-- දුරකථන අංකය ඇතුළත් කිරීමේ කොටස -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" placeholder="Enter phone number" required>
                </div>
                <!-- මුරපදය ඇතුළත් කිරීමේ කොටස -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <!-- ලොග් වීමේ බොත්තම -->
                <button type="submit" class="btn">Login</button>
                <!-- ලොග් වීම වැරදුනහොත් පෙන්වන දෝෂ පණිවිඩය -->
                <p id="error-message" class="error-msg"></p>
            </form>
        </div>

        <!-- 2. Dashboard Section (සාර්ථකව ලොග් වූ පසු පෙන්වන ප්‍රධාන පිටුව - මුලින් සඟවා ඇත) -->
        <div id="dashboard-section" class="card dashboard-container hidden">
            <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                
                <!-- ඩෑෂ්බෝඩ් එකේ වම් පැත්තෙන් ලාංඡනය සහ නම පෙන්වීම -->
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img src="logo.png" alt="Meta Electronics Logo" style="width: 75px; height: 75px; border-radius: 50%; object-fit: cover;">
                    <div>
                        <h3 style="margin: 0; font-size: 18px;">Meta Electronics</h3>
                        <span style="font-size: 13px; color: #666;">Dashboard</span>
                    </div>
                </div>

                <!-- පද්ධතියෙන් ඉවත් වීමට (Logout) ඇති බොත්තම -->
                <button id="logout-btn" class="btn logout-btn" style="width: auto; padding: 6px 12px;">Logout</button>
            </div>

            <!-- ඩෑෂ්බෝඩ් එකේ ප්‍රධාන මෙහෙයුම් බොත්තම් ජාලය -->
            <div class="button-grid">
                <!-- 'Add Job' ක්ලික් කළ විට අදාළ ෆෝම් එක පෙන්වීමට සකසා ඇත -->
                <button class="dash-btn" onclick="showSection('add-job-section')">Add Job</button>
                <!-- Pending Jobs ක්ලික් කළ විට pending-jobs.html ෆයිල් එක විවෘත වන ලෙස සකස් කරන ලදී -->
                <button class="dash-btn" onclick="openPage('pending-jobs')">Pending Jobs</button>
                <button class="dash-btn" onclick="openPage('finish-jobs')">Finish Jobs</button>
                <button class="dash-btn" onclick="openPage('settings')">Settings</button>
            </div>
        </div>

        <!-- 3. Add Job Section (අලුත් ජොබ් එකක් රෙজিস্টර් කිරීමට 'Add Job' ක්ලික් කළ විට පෙන්වයි) -->
        <div id="add-job-section" class="card hidden" style="text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Register New Job</h2>
                <!-- නැවත ඩෑෂ්බෝඩ් එකට යාමට 'Back' බොත්තම -->
                <button type="button" class="btn" style="width: auto; padding: 5px 10px; background-color: #6c757d;" onclick="showSection('dashboard-section')">Back</button>
            </div>
            
            <!-- ජොබ් විස්තර ඇතුළත් කරන පෝරමය -->
            <form id="add-job-form">
                <!-- භාණ්ඩයේ නම -->
                <div class="form-group">
                    <label for="item">ITEM (භාණ්ඩය)</label>
                    <input type="text" id="item" placeholder="Ex: TV, Laptop, Sound System" required>
                </div>
                <!-- භාණ්ඩයේ මොඩල් එක -->
                <div class="form-group">
                    <label for="model">MODEL (මොඩල් එක)</label>
                    <input type="text" id="model" placeholder="Ex: Samsung 32 inch" required>
                </div>
                <!-- සීරියල් අංකය -->
                <div class="form-group">
                    <label for="serial_number">Serial Number (සීරියල් අංකය)</label>
                    <input type="text" id="serial_number" placeholder="Enter serial number" required>
                </div>
                <!-- දෝෂය -->
                <div class="form-group">
                    <label for="fault">Fault (දෝෂය)</label>
                    <input type="text" id="fault" placeholder="Ex: No power, Display issue" required>
                </div>
                <!-- පාරිභෝගිකයාගේ දුරකථන අංකය -->
                <div class="form-group">
                    <label for="customer_phone">Customer Phone Number (පාරිභෝගිකයාගේ අංකය)</label>
                    <input type="text" id="customer_phone" placeholder="Ex: 0711462838" required>
                </div>
                <!-- ජොබ් එක රෙজিস্টර් කිරීමේ බොත්තම -->
                <button type="submit" class="btn">Register Job</button>
                <!-- ජොබ් එක සාර්ථකද නැද්ද යන්න පෙන්වන පණිවිඩය -->
                <p id="job-msg" style="margin-top: 15px; font-weight: bold; text-align: center;"></p>
            </form>
        </div>
    </div>

    <script>
        // Supabase සේවාදායකය සඳහා අවශ්‍ය URL සහ Anon Key නිවැරදිව සැකසීම
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // HTML අංග (Elements) JavaScript හරහා පාලනය කිරීමට විචල්‍යයන්ට ලබා ගැනීම
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const addJobSection = document.getElementById('add-job-section');
        const errorMessage = document.getElementById('error-message');
        const logoutBtn = document.getElementById('logout-btn');
        const addJobForm = document.getElementById('add-job-form');
        const jobMsg = document.getElementById('job-msg');

        // පේජ් එක ලෝඩ් වන විට පරිශීලකයා දැනටමත් ලොග් වී ඇත්දැයි පරීක්ෂා කිරීම (Session Check)
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                // පරිශීලකයා ලොග් වී ඇත්නම් ලොගින් පේජ් එක සඟවා ඩෑෂ්බෝඩ් එක පෙන්වීම
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
            }
        });

        // Admin Login ක්‍රියාවලිය හැසිරවීම (ස්‍ථිර ඊමේල් එකක් හරහා ලොග් වී, දුරකථන අංකය profiles ටේබල් එකෙන් පරීක්ෂා කිරීම)
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // ෆෝම් එක සාමාන්‍ය ආකාරයට රීලෝඩ් වීම වැළැක්වීම
            const phoneInput = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            errorMessage.textContent = ''; // පැරණි දෝෂ පණිවිඩ මකා දැමීම

            // 1. මුලින්ම පද්ධතියේ ප්‍රධාන ස්ථිර ඊමේල් එක භාවිතයෙන් Supabase Auth හරහා ලොග් වීම (Admin එකවුන්ට් එක සඳහා)
            const adminEmail = "admin@meta.lk"; 
            const { data: authData, error: authError } = await supabaseClient.auth.signInWithPassword({
                email: adminEmail,
                password: password
            });

            if (authError) {
                errorMessage.textContent = "Login Failed: Check your Password!";
                return;
            }

            // 2. ලොග් වූ යූසර්ගේ ID එකට අදාළ දුරකථන අංකය පමණක් profiles ටේබල් එකෙන් ලබා ගැනීම (Multiple rows ගැටළුව මඟහරවා ගැනීමට .eq පාවිච්චි කර ඇත)
            const { data: profileData, error: profileError } = await supabaseClient
                .from('profiles')
                .select('phone')
                .eq('id', authData.user.id)
                .single();

            // ටේබල් එකේ අංකයක් නැත්නම් හෝ ඇතුළත් කළ අංකය ටේබල් එකේ ඇති අංකයට සමාන නැත්නම්
            if (profileError || !profileData || profileData.phone !== phoneInput) {
                errorMessage.textContent = "Login Failed: Incorrect Phone Number!";
                await supabaseClient.auth.signOut(); // වැරදි නම් ලොග් වීම අත්හිටුවා නැවත ලොග්අවුට් කිරීම
                return;
            }

            // සියල්ල සාර්ථක නම් ඩෑෂ්බෝඩ් එක පෙන්වීම
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
        });

        // පද්ධතියෙන් ඉවත් වීමේ (Logout) ක්‍රියාවලිය
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut(); // Supabase ගිණුමෙන් අයින් වීම
            dashboardSection.classList.add('hidden');
            addJobSection.classList.add('hidden');
            loginSection.classList.remove('hidden'); // ලොගින් පේජ් එක පෙන්වීම
            loginForm.reset(); // ෆෝම් එක හිස් කිරීම
        });

        // ඩෑෂ්බෝඩ් එක ඇතුළේ විවිධ කොටස් මාරු කර පෙන්වීමේ කාර්යය (Show/Hide කිරීම)
        function showSection(sectionId) {
            dashboardSection.classList.add('hidden');
            addJobSection.classList.add('hidden');
            
            // අවශ්‍ය කරන කොටස മാത്രം පෙන්වීම
            document.getElementById(sectionId).classList.remove('hidden');
        }

        // අලුත් Job එකක් Register Form එක Submit කළ විට ක්‍රියාත්මක වීම
        addJobForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            jobMsg.textContent = '';

            // ෆෝම් එකෙන් දත්ත ලබා ගැනීම
            const item = document.getElementById('item').value;
            const model = document.getElementById('model').value;
            const serialNumber = document.getElementById('serial_number').value;
            const fault = document.getElementById('fault').value;
            const customerPhone = document.getElementById('customer_phone').value.trim();

            // jobs ටේබල් එකට දත්ත ඇතුළත් කිරීම
            const { data, error } = await supabaseClient
                .from('jobs')
                .insert([
                    { 
                        item: item, 
                        model: model, 
                        serial_number: serialNumber, 
                        fault: fault, 
                        customer_phone: customerPhone, 
                        status: 'Pending' // අලුතින් දමන ජොබ් එකක් මූලිකව 'Pending' ලෙස සටහන් වේ
                    }
                ]);

            // දෝෂයක් ඇත්නම්
            if (error) {
                jobMsg.style.color = 'red';
                jobMsg.textContent = "Error: Failed to register job!";
                console.error(error);
            } else {
                // සාර්ථක නම්
                jobMsg.style.color = 'green';
                jobMsg.textContent = "Job Registered Successfully!";
                addJobForm.reset(); // ෆෝම් එක හිස් කිරීම

                // පාරිභෝගිකයාගේ WhatsApp අංකයට ස්වයංක්‍රීයව GitHub Pages ලින්ක් එක යැවීම සඳහා සකස් කිරීම
                let customerMsg = `Hello, your job for ${item} (${model}) has been registered at Meta Electronics. Track status here: https://roshan-pradeep.github.io/meta_electronics/customer.html?phone=${customerPhone}`;
                let whatsappUrl = `https://wa.me/94${customerPhone.replace(/^0/, '')}?text=${encodeURIComponent(customerMsg)}`;
                
                // තත්පර 1කින් ස්වයංක්‍රීයව WhatsApp වෙත යොමු කිරීම
                setTimeout(() => {
                    window.open(whatsappUrl, '_blank');
                }, 1000);
            }
        });

        // පිටු මාරු කිරීම සඳහා සකස් කළ කාර්යය (Pending, Finish, Settings වෙත යාමට සහ ඩෑෂ්බෝඩ් එකෙන් අනෙක් පේජ්වලට යාමට)
        function openPage(pageName) {
            if (pageName === 'pending-jobs') {
                window.location.href = 'pending-jobs.html'; // Pending Jobs පේජ් එකට යාමට
            } else if (pageName === 'finish-jobs') {
                window.location.href = 'finish-jobs.html'; // Finish Jobs පේජ් එකට යාමට
            } else if (pageName === 'settings') {
                window.location.href = 'settings.html'; // Settings පේජ් එකට යාමට
            } else if (pageName === 'dashboard') {
                window.location.href = 'index.html'; // වෙනත් පේජ්වල සිට ප්‍රධාන ඩෑෂ්බෝඩ් එකට (index.html වෙත) පැමිණීමට
            } else {
                alert(pageName + " page will open soon!");
            }
        }
    </script>
</body>
</html>
