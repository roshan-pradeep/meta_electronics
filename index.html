<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Electronics - Admin Login</title>
    <!-- CSS ස්ටයිල් ෆයිල් එක සම්බන්ධ කිරීම -->
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JavaScript Library එක CDN එක හරහා ඇතුළත් කිරීම -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="container">
        <!-- Login වෙන්න අවශ්‍ය කොටස (මුලින්ම පෙන්වයි) -->
        <div id="login-section" class="card">
            <h1>Welcome Meta Electronics</h1>
            <form id="login-form">
                <!-- දුරකථන අංකය ඇතුළත් කරන කොටස -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" placeholder="Enter phone number" required>
                </div>
                <!-- මුරපදය ඇතුළත් කරන කොටස -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <!-- Login බටන් එක -->
                <button type="submit" class="btn">Login</button>
                <!-- වැරදුනොත් පෙන්වන දෝෂ පණිවිඩය -->
                <p id="error-message" class="error-msg"></p>
            </form>
        </div>

        <!-- ඩෑෂ්බෝඩ් එක (සාර්ථකව ලොග් වූ පසු පෙන්වයි, මුලින් සඟවා ඇත) -->
        <div id="dashboard-section" class="card dashboard-container hidden">
            <div class="dashboard-header">
                <h2>Meta Electronics Dashboard</h2>
                <!-- ඉවත් වීමට (Logout) බටන් එක -->
                <button id="logout-btn" class="btn logout-btn">Logout</button>
            </div>
            <!-- ඩෑෂ්බෝඩ් එකේ ප්‍රධාන බොත්තම් ටික -->
            <div class="button-grid">
                <button class="dash-btn" onclick="openPage('add-job')">Add Job</button>
                <button class="dash-btn" onclick="openPage('pending-jobs')">Pending Jobs</button>
                <button class="dash-btn" onclick="openPage('finish-jobs')">Finish Jobs</button>
                <button class="dash-btn" onclick="openPage('settings')">Settings</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Project URL සහ Anon Key නිවැරදිව ඇතුළත් කර ඇත
        const SUPABASE_URL = 'https://udqlwyxltmysaocynlhi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_lW_lADCtcwpb-fxnmG-g7w_gWHhGA2M';

        // දෝෂ මඟහරවා ගැනීම සඳහා 'supabaseClient' ලෙස Supabase Client එක ආරම්භ කිරීම
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // HTML අංග (Elements) JavaScript හරහා පාලනය කිරීමට ලබා ගැනීම
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const errorMessage = document.getElementById('error-message');
        const logoutBtn = document.getElementById('logout-btn');

        // Login Form එක Submit කරන විට ක්‍රියාත්මක වන කොටස
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault(); // ෆෝම් එක සාමාන්‍ය ආකාරයට රීලෝඩ් වීම වළකයි
            
            // පාරිභෝගිකයා ඇතුළත් කළ දුරකථන අංකය සහ පාස්වර්ඩ් එක ලබා ගැනීම
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;

            // මුලින් තිබූ දෝෂ පණිවිඩ ඉවත් කිරීම
            errorMessage.textContent = '';

            // දුරකථන අංකය සමඟ '@meta.lk' එකතු කර එය email එකක් ලෙස සකසා ගනියි (උදා: 0771234567@meta.lk)
            const dummyEmail = phone.trim() + "@meta.lk";

            // Supabase Authentication හරහා පරිශීලකයා පරීක්ෂා කිරීම (supabaseClient පාවිච්චි කර ඇත)
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: dummyEmail,
                password: password
            });

            // දෝෂයක් ඇත්නම් (වැරදි නම්)
            if (error) {
                errorMessage.textContent = "Login Failed: Check your Phone Number or Password!";
            } else {
                // සාර්ථක නම් - Login කොටස සඟවා ඩෑෂ්බෝඩ් එක පෙන්වීම
                loginSection.classList.add('hidden');
                dashboardSection.classList.remove('hidden');
            }
        });

        // Logout බටන් එක ක්ලික් කළ විට ක්‍රියාත්මක වන කොටස
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut(); // Supabase ගිණුමෙන් ඉවත් වීම
            dashboardSection.classList.add('hidden'); // ඩෑෂ්බෝඩ් එක වැසීම
            loginSection.classList.remove('hidden'); // ලොගින් පේජ් එක පෙන්වීම
            loginForm.reset(); // ෆෝම් එකේ දත්ත මකා දැමීම
        });

        // ඩෑෂ්බෝඩ් එකේ බොත්තම් ක්ලික් කළ විට ක්‍රියාත්මක වන කාර්යය
        function openPage(pageName) {
            alert(pageName + " page will open here!");
            // ඉදිරියට මෙම බොත්තම් හරහා අදාළ පිටු වෙත යාමට අවශ්‍ය කෝඩ් එක මෙතැනට එකතු කළ හැක.
        }
    </script>
</body>
</html>
